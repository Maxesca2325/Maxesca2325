<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }</script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b0a18; }
      #w3d-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      /* the 3D canvas textures use these faces: keep them in the font bundle */
      #fontkeep { position:absolute; left:-9999px; top:0; font-size:10px; }
      #fontkeep .a { font-family:'Oswald'; font-weight:700; } #fontkeep .b { font-family:'EB Garamond'; font-style:italic; } #fontkeep .c { font-family:'JetBrains Mono'; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="60">
      <canvas id="w3d-canvas" class="clip" data-start="0" data-duration="15" data-track-index="0" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="fontkeep" data-layout-ignore><span class="a">RÈGLE</span><span class="b">Ne réponds pas</span><span class="c">2:41</span></div>
      <div id="overlay" data-composition-id="overlay" data-composition-src="compositions/overlay.html" data-start="0" data-duration="15" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="15" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:6"></div>
      <audio id="mix" class="clip" src="assets/proto_mix.wav" data-start="0" data-duration="15" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const state = { t: 0 };
      const draw = () => { window.__w3dTime = state.t; if (window.__render3d) window.__render3d(state.t); };
      tl.fromTo(state, { t: 0 }, { t: 15, duration: 15, ease: "none", onUpdate: draw }, 0);
      window.addEventListener("hf-seek", (e) => {
        const d = e && e.detail;
        if (d && typeof d.time === "number") tl.totalTime(Math.min(d.time, tl.totalDuration()), true);
        draw();
      });
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="scene3d.js"></script>
  </body>
</html>
