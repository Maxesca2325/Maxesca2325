<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0E0C1C; }
      #bg { position: absolute; inset: 0; background: #0E0C1C; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920" data-fps="60" data-motion-blur="on">
      <div id="bg" data-layout-ignore></div>
      <div id="s1-chambre" data-composition-id="s1-chambre" data-composition-src="compositions/s1-chambre.html" data-start="0" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s2-porte" data-composition-id="s2-porte" data-composition-src="compositions/s2-porte.html" data-start="5.3" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="s3-feuille" data-composition-id="s3-feuille" data-composition-src="compositions/s3-feuille.html" data-start="10.0" data-duration="5.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="overlay" data-composition-id="overlay" data-composition-src="compositions/overlay.html" data-start="0" data-duration="15" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="15" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
