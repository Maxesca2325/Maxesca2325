name: Deploy Hôtel Taciana to GitHub Pages

on:
  push:
    branches:
      - claude/wizardly-cori-h22oxi
    paths:
      - 'hotel-taciana/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hotel-taciana
      - id: deployment
        uses: actions/deploy-pages@v4
