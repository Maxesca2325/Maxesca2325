services:
  binance-mcp:
    build: .
    env_file: .env
    volumes:
      - ./data:/data          # journal.jsonl = trace de chaque ordre
    restart: unless-stopped

  caddy:                      # HTTPS automatique (certificat Let's Encrypt gratuit)
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
